services:
  - type: web
    name: agrisync-ai-sindh
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_URI
        sync: false
      - key: FIREBASE_DB_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
